[project]
name = "traffic-pred"
version = "0.1.0"
description = "Delay prediction for Norwegian public transport using Entur real-time data"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
]

[project.scripts]
collector = "traffic_pred.collector:main"
parse = "traffic_pred.parser:main"
journeys = "traffic_pred.journeys:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
